global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:

  - job_name: "prometheus"
    static_configs:
      - targets:
          - "prometheus:9090"

  - job_name: "resq-backend"
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - "http://backend:5000"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target

      - source_labels: [__param_target]
        target_label: instance

      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: "resq-frontend"
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - "http://frontend:80"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target

      - source_labels: [__param_target]
        target_label: instance

      - target_label: __address__
        replacement: blackbox-exporter:9115