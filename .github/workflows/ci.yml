name: RESQ CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Validate backend syntax
        run: node --check server.js

  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest

    needs:
      - frontend
      - backend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Create CI environment file
        shell: bash
        run: |
          cat > .env <<'EOF'
          DB_NAME=resq
          DB_USER=resq
          DB_PASSWORD=resq_ci_password
          JWT_SECRET=resq_ci_secret
          EOF

      - name: Build Docker images
        run: docker compose build

      - name: Start RESQ application
        run: docker compose up -d

      - name: Wait for backend
        shell: bash
        run: |
          echo "Waiting for RESQ backend..."

          for i in {1..30}; do
            if curl -fsS http://localhost:5000 > /dev/null 2>&1; then
              echo "Backend is ready."
              exit 0
            fi

            echo "Waiting... attempt $i/30"
            sleep 2
          done

          echo "Backend did not become ready."
          docker compose ps
          docker compose logs backend
          exit 1

      - name: Wait for frontend
        shell: bash
        run: |
          echo "Waiting for RESQ frontend..."

          for i in {1..30}; do
            if curl -fsS http://localhost:3000 > /dev/null 2>&1; then
              echo "Frontend is ready."
              exit 0
            fi

            echo "Waiting... attempt $i/30"
            sleep 2
          done

          echo "Frontend did not become ready."
          docker compose ps
          docker compose logs frontend
          exit 1

      - name: Run automated smoke tests
        run: node tests/smoke.test.js

      - name: Show running containers
        if: always()
        run: docker compose ps

      - name: Show application logs
        if: failure()
        run: docker compose logs

      - name: Stop RESQ application
        if: always()
        run: docker compose down -v